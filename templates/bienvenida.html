<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenido — Tenis Club Milagro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --verde-oscuro: #1B4D2E;
      --verde-medio: #2d6a4f;
      --dorado: #C9A84C;
      --blanco: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--blanco);
      background:
        radial-gradient(circle at 50% 20%, rgba(201,168,76,0.28), transparent 28%),
        linear-gradient(135deg, #123721 0%, var(--verde-oscuro) 46%, #0e291a 100%);
      overflow: hidden;
    }
    .welcome-stage {
      width: min(760px, calc(100vw - 32px));
      text-align: center;
      animation: riseIn 850ms ease-out both;
    }
    .welcome-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      padding: 8px;
      margin-bottom: 22px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.28);
      animation: glowPulse 1600ms ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
      text-wrap: balance;
    }
    .loading-text {
      margin-top: 18px;
      color: rgba(255,255,255,0.82);
      font-size: 15px;
      font-weight: 600;
    }
    .loader {
      width: min(360px, 80vw);
      height: 6px;
      margin: 24px auto 0;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      overflow: hidden;
    }
    .loader span {
      display: block;
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, var(--dorado), #fff1a8);
      border-radius: inherit;
      animation: loadSweep 1400ms ease-in-out infinite;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes glowPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 18px 50px rgba(0,0,0,0.28); }
      50% { transform: scale(1.04); box-shadow: 0 22px 70px rgba(201,168,76,0.42); }
    }
    @keyframes loadSweep {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <main class="welcome-stage">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Milagro Tenis Club" class="welcome-logo">
    <h1>Bienvenido al mejor club de tenis de Milagro</h1>
    <div class="loading-text"><i class="bi bi-stars me-1"></i> Cargando Sistema Contable...</div>
    <div class="loader"><span></span></div>
  </main>
  <script>
    setTimeout(() => {
      window.location.href = {{ destino|tojson }};
    }, 2600);
  </script>
</body>
</html>
