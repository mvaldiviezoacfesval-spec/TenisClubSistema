{% extends 'base.html' %}
{% block title %}Nueva Nota de Crédito{% endblock %}
{% block icon %}file-earmark-minus{% endblock %}
{% block page_title %}Nueva Nota de Crédito{% endblock %}
{% block content %}
<div class="module-header">
  <h2><i class="bi bi-file-earmark-minus me-2"></i>Nueva Nota de Crédito</h2>
  <a href="{{ url_for('notas_credito') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>
<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Número</label>
          <input type="text" class="form-control" value="{{ numero }}" readonly style="background:#f8f9fa">
        </div>
        <div class="col-md-3">
          <label class="form-label">Fecha *</label>
          <input type="date" name="fecha" class="form-control" required value="{{ hoy }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Tipo</label>
          <select name="tipo" class="form-select">
            <option value="Venta">Venta</option>
            <option value="Compra">Compra</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Factura de Referencia</label>
          <input type="text" name="factura_ref" class="form-control" placeholder="Ej: FV-2026-0001">
        </div>
        <div class="col-md-6">
          <label class="form-label">Cliente / Proveedor *</label>
          <input type="text" name="cliente_nombre" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Total (USD) *</label>
          <input type="number" name="total" step="0.01" min="0.01" class="form-control" required>
        </div>
        <div class="col-md-12">
          <label class="form-label">Motivo *</label>
          <textarea name="motivo" class="form-control" rows="2" required placeholder="Describa el motivo de la nota de crédito"></textarea>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Emitir</button>
        <a href="{{ url_for('notas_credito') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
