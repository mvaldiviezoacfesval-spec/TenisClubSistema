{% extends 'base.html' %}
{% block title %}Nuevo Rol{% endblock %}
{% block icon %}receipt-cutoff{% endblock %}
{% block page_title %}Generar Rol de Pago{% endblock %}
{% block content %}
<div class="card"><div class="card-body"><form method="POST" class="row g-3">
  <div class="col-md-5"><label class="form-label">Empleado</label><select name="empleado_id" class="form-select" required>{% for e in empleados %}<option value="{{ e.id }}" data-salario="{{ e.salario_base }}">{{ e.apellidos }} {{ e.nombres }} - ${{ "%.3f"|format(e.salario_base) }}</option>{% endfor %}</select></div>
  <div class="col-md-2"><label class="form-label">Periodo</label><input name="periodo" type="month" value="{{ hoy[:7] }}" class="form-control" required></div>
  <div class="col-md-2"><label class="form-label">Salario base</label><input name="salario_base" type="number" step="0.001" class="form-control" required></div>
  <div class="col-md-1"><label class="form-label">H. extra</label><input name="horas_extra" type="number" step="0.001" value="0" class="form-control"></div>
  <div class="col-md-1"><label class="form-label">Bonos</label><input name="bonos" type="number" step="0.001" value="0" class="form-control"></div>
  <div class="col-md-1"><label class="form-label">Desc.</label><input name="otros_descuentos" type="number" step="0.001" value="0" class="form-control"></div>
  <div class="col-12"><button class="btn btn-primary">Generar</button><a href="{{ url_for('nomina') }}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
</form></div></div>
<script>
const sel = document.querySelector('[name=empleado_id]');
const sal = document.querySelector('[name=salario_base]');
function fillSalary(){ if(sel && sel.selectedOptions[0]) sal.value = sel.selectedOptions[0].dataset.salario || ''; }
sel?.addEventListener('change', fillSalary); fillSalary();
</script>
{% endblock %}
