{% extends 'base.html' %}
{% block title %}Nueva CxP{% endblock %}
{% block icon %}plus-circle{% endblock %}
{% block page_title %}Nueva Cuenta por Pagar{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header"><i class="bi bi-pencil-square me-1"></i>Datos de la cuenta</div>
  <div class="card-body">
    <form method="POST" class="row g-3">
      <div class="col-md-6"><label class="form-label">Proveedor</label><input name="proveedor_nombre" class="form-control" required></div>
      <div class="col-md-3"><label class="form-label">Fecha emision</label><input name="fecha_emision" type="date" value="{{ hoy }}" class="form-control" required></div>
      <div class="col-md-3"><label class="form-label">Fecha vencimiento</label><input name="fecha_vencimiento" type="date" value="{{ hoy }}" class="form-control" required></div>
      <div class="col-md-8"><label class="form-label">Concepto</label><input name="concepto" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">Monto</label><input name="monto_original" type="number" step="0.001" min="0" class="form-control" required></div>
      <div class="col-12"><label class="form-label">Referencia</label><input name="referencia" class="form-control"></div>
      <div class="col-12"><button class="btn btn-primary">Guardar</button><a href="{{ url_for('cxp') }}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
    </form>
  </div>
</div>
{% endblock %}
