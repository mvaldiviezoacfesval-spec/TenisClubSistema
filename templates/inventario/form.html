{% extends 'base.html' %}
{% block title %}Nuevo Articulo{% endblock %}
{% block icon %}box-seam{% endblock %}
{% block page_title %}Nuevo Articulo de Inventario{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
  <form method="POST" class="row g-3">
    <div class="col-md-3"><label class="form-label">Codigo</label><input name="codigo" class="form-control" required></div>
    <div class="col-md-5"><label class="form-label">Nombre</label><input name="nombre" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label">Categoria</label><input name="categoria" class="form-control"></div>
    <div class="col-12"><label class="form-label">Descripcion</label><input name="descripcion" class="form-control"></div>
    <div class="col-md-2"><label class="form-label">Unidad</label><input name="unidad" value="Unidad" class="form-control"></div>
    <div class="col-md-2"><label class="form-label">Stock inicial</label><input name="stock_actual" type="number" step="0.001" value="0" class="form-control"></div>
    <div class="col-md-2"><label class="form-label">Stock minimo</label><input name="stock_minimo" type="number" step="0.001" value="5" class="form-control"></div>
    <div class="col-md-2"><label class="form-label">Costo</label><input name="precio_costo" type="number" step="0.001" value="0" class="form-control"></div>
    <div class="col-md-2"><label class="form-label">Venta</label><input name="precio_venta" type="number" step="0.001" value="0" class="form-control"></div>
    <div class="col-md-2"><label class="form-label">Ubicacion</label><input name="ubicacion" class="form-control"></div>
    <div class="col-12"><button class="btn btn-primary">Guardar</button><a href="{{ url_for('inventario') }}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
  </form>
</div></div>
{% endblock %}
