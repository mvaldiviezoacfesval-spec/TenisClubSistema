{% extends 'base.html' %}
{% block title %}{{ accion }} Socio{% endblock %}
{% block icon %}person-plus{% endblock %}
{% block page_title %}{{ accion }} Socio{% endblock %}
{% block content %}
<div class="module-header">
  <h2><i class="bi bi-person-plus me-2"></i>{{ accion }} Socio</h2>
  <a href="{{ url_for('socios') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>
<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Nombres *</label>
          <input type="text" name="nombres" class="form-control" required value="{{ socio.nombres if socio else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Apellidos *</label>
          <input type="text" name="apellidos" class="form-control" required value="{{ socio.apellidos if socio else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Cédula *</label>
          <input type="text" name="cedula" class="form-control" required value="{{ socio.cedula if socio else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ socio.email if socio else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Teléfono</label>
          <input type="text" name="telefono" class="form-control" value="{{ socio.telefono if socio else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Categoría</label>
          <select name="categoria" class="form-select">
            {% for cat in ['Activo','Honorario','Juvenil','Vitalicio'] %}
            <option value="{{ cat }}" {% if socio and socio.categoria==cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Dirección</label>
          <input type="text" name="direccion" class="form-control" value="{{ socio.direccion if socio else '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Fecha de Ingreso *</label>
          <input type="date" name="fecha_ingreso" class="form-control" required value="{{ socio.fecha_ingreso if socio else '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Fecha de Nacimiento</label>
          <input type="date" name="fecha_nacimiento" class="form-control" value="{{ socio.fecha_nacimiento if socio else '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Cuota Mensual (USD)</label>
          <input type="number" name="cuota_mensual" step="0.001" class="form-control" value="{{ socio.cuota_mensual if socio else '30.00' }}">
        </div>
        {% if accion == 'Editar' %}
        <div class="col-md-3">
          <label class="form-label">Estado</label>
          <select name="estado" class="form-select">
            {% for est in ['Activo','Inactivo','Suspendido'] %}
            <option value="{{ est }}" {% if socio and socio.estado==est %}selected{% endif %}>{{ est }}</option>
            {% endfor %}
          </select>
        </div>
        {% endif %}
        <div class="col-12">
          <label class="form-label">Observaciones</label>
          <textarea name="observaciones" class="form-control" rows="2">{{ socio.observaciones if socio else '' }}</textarea>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar</button>
        <a href="{{ url_for('socios') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
