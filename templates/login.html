<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — Tenis Club Milagro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6f8;
    }
    .login-shell {
      width: min(420px, calc(100vw - 32px));
    }
    .login-logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
      background: white;
      border-radius: 8px;
      padding: 6px;
      box-shadow: var(--sombra);
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Milagro Tenis Club" class="login-logo">
    <div class="card">
      <div class="card-header justify-content-center">
        <i class="bi bi-shield-lock me-1"></i> Acceso Administrativo
      </div>
      <div class="card-body">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for cat, msg in messages %}
              <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input name="usuario" class="form-control" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input name="contrasena" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Entrar</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
