{% extends 'base.html' %}
{% block title %}Nueva Cuenta{% endblock %}
{% block icon %}diagram-3{% endblock %}
{% block page_title %}Nueva Cuenta Contable{% endblock %}
{% block content %}
<div class="module-header">
  <h2><i class="bi bi-diagram-3 me-2"></i>Nueva Cuenta</h2>
  <a href="{{ url_for('plan_cuentas') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>
<div class="card" style="max-width:560px">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Código *</label>
          <input type="text" name="codigo" class="form-control" required placeholder="Ej: 1.1.08">
        </div>
        <div class="col-md-8">
          <label class="form-label">Nombre *</label>
          <input type="text" name="nombre" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Tipo *</label>
          <select name="tipo" class="form-select" required>
            <option value="Activo">Activo</option>
            <option value="Pasivo">Pasivo</option>
            <option value="Patrimonio">Patrimonio</option>
            <option value="Ingreso">Ingreso</option>
            <option value="Gasto">Gasto</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Naturaleza *</label>
          <select name="naturaleza" class="form-select" required>
            <option value="Deudora">Deudora</option>
            <option value="Acreedora">Acreedora</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Nivel</label>
          <select name="nivel" class="form-select">
            <option value="1">1 — Grupo</option>
            <option value="2">2 — Subgrupo</option>
            <option value="3" selected>3 — Cuenta</option>
            <option value="4">4 — Subcuenta</option>
          </select>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar</button>
        <a href="{{ url_for('plan_cuentas') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
