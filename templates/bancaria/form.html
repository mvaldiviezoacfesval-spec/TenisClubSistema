{% extends 'base.html' %}
{% block title %}Movimiento Bancario{% endblock %}
{% block icon %}bank{% endblock %}
{% block page_title %}Nuevo Movimiento Bancario{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
  <form method="POST" class="row g-3">
    <div class="col-md-4"><label class="form-label">Cuenta bancaria</label><input name="cuenta_bancaria" class="form-control" required></div>
    <div class="col-md-3"><label class="form-label">Fecha</label><input name="fecha" type="date" value="{{ hoy }}" class="form-control" required></div>
    <div class="col-md-2"><label class="form-label">Tipo</label><select name="tipo" class="form-select"><option>Ingreso</option><option>Egreso</option></select></div>
    <div class="col-md-3"><label class="form-label">Monto</label><input name="monto" type="number" step="0.01" class="form-control" required></div>
    <div class="col-md-8"><label class="form-label">Descripcion</label><input name="descripcion" class="form-control" required></div>
    <div class="col-md-2"><label class="form-label">Saldo banco</label><input name="saldo_banco" type="number" step="0.01" class="form-control"></div>
    <div class="col-md-2"><label class="form-label">Referencia</label><input name="referencia" class="form-control"></div>
    <div class="col-12"><button class="btn btn-primary">Guardar</button><a href="{{ url_for('bancaria') }}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
  </form>
</div></div>
{% endblock %}
